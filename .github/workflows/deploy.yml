name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migration:
        description: 'Skip database migration'
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Build and rsync to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 18
    if: github.ref == 'refs/heads/main'
    env:
      DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          extensions: mbstring, xml, bcmath, curl, zip, pdo_mysql
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-prod-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-prod-

      - name: Production env for build only
        run: |
          cp .env.example .env
          printf '\nAPP_ENV=production\nAPP_DEBUG=false\n' >> .env

      - name: Composer
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Vite
        run: |
          npm ci
          npm run build

      - name: Drop runner .env so it cannot be copied
        run: rm -f .env

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Rsync to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          if [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_USER:-}" ] || [ -z "${DEPLOY_PATH:-}" ]; then
            echo "Thiếu secrets VPS: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, SSH_PRIVATE_KEY"
            exit 1
          fi
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          chmod +x scripts/server-release.sh
          rsync -az --delete \
            --exclude-from=.github/deploy-exclude.txt \
            -e "ssh -p $PORT -o StrictHostKeyChecking=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Migrate and optimize
        uses: appleboy/ssh-action@v1.2.2
        env:
          SKIP_MIGRATION: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_migration || false }}
          PHP_BIN: ${{ secrets.PHP_BIN }}
          DEPLOY_POST_CMD: ${{ secrets.DEPLOY_POST_CMD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SKIP_MIGRATION,PHP_BIN,DEPLOY_POST_CMD
          script_stop: true
          command_timeout: 8m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            export SKIP_MIGRATION="${SKIP_MIGRATION:-false}"
            export PHP_BIN="${PHP_BIN:-php}"
            bash scripts/server-release.sh
            if [ -n "${DEPLOY_POST_CMD:-}" ]; then
              eval "$DEPLOY_POST_CMD"
            fi

      - name: Health check
        if: env.DEPLOY_URL != ''
        continue-on-error: true
        run: curl -fsS -o /dev/null -w "HTTP %{http_code}\n" --max-time 20 "$DEPLOY_URL"

      - name: Telegram
        if: always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        continue-on-error: true
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            TEXT="Deploy tiemnhaduy.com OK
          commit ${{ github.sha }}
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            TEXT="Deploy tiemnhaduy.com FAILED
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" >/dev/null
