name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migration:
        description: 'Skip database migration (ignored on Docker; app still migrates on start)'
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Rsync and Docker release on VPS
    runs-on: [self-hosted, tiemnhaduy]
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main'
    env:
      DEPLOY_URL: ${{ secrets.DEPLOY_URL || 'https://tiemnhaduy.com' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync into app directory
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_PATH:-}" ]; then
            echo "Thiếu secret DEPLOY_PATH"
            exit 1
          fi
          mkdir -p "$DEPLOY_PATH"
          chmod +x scripts/server-release.sh
          rsync -a --delete \
            --exclude-from=.github/deploy-exclude.txt \
            ./ "$DEPLOY_PATH/"

      - name: Docker compose release
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          bash scripts/server-release.sh

      - name: Health check
        if: env.DEPLOY_URL != ''
        continue-on-error: true
        run: curl -fsS -o /dev/null -w "HTTP %{http_code}\n" --max-time 20 "$DEPLOY_URL"

      - name: Telegram
        if: always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        continue-on-error: true
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            TEXT="Deploy tiemnhaduy.com OK
          commit ${{ github.sha }}
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            TEXT="Deploy tiemnhaduy.com FAILED
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" >/dev/null
