name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, xml, bcmath, curl, zip, pdo_sqlite
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-dev-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-dev-

      - name: App env
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite

      - name: Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Key
        run: php artisan key:generate --force

      - name: Vite
        run: |
          npm ci
          npm run build

      - name: Tests
        run: php artisan test --no-interaction
