name: tiemnhaduy

x-app-build: &app-build
  context: ..
  dockerfile: deploy/Dockerfile
  args:
    VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-}
    VITE_REVERB_HOST: ${VITE_REVERB_HOST:-ws.tiemnhaduy.com}
    VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
    VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}

services:
  app:
    build: *app-build
    env_file:
      - path: ../.env
        required: true
    environment:
      RUN_MIGRATIONS: "1"
    ports:
      - "127.0.0.1:9090:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../.env:/var/www/html/.env:ro
      - laravel-storage:/var/www/html/storage
      - laravel-cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks: [default, vps-internal]

  reverb:
    build: *app-build
    env_file:
      - path: ../.env
        required: true
    environment:
      RUN_MIGRATIONS: "0"
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "127.0.0.1:9091:8080"
    volumes:
      - ../.env:/var/www/html/.env:ro
      - laravel-storage:/var/www/html/storage
      - laravel-cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks: [default, vps-internal]

  queue:
    build: *app-build
    env_file:
      - path: ../.env
        required: true
    environment:
      RUN_MIGRATIONS: "0"
    command: ["php", "artisan", "queue:work", "database", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - ../.env:/var/www/html/.env:ro
      - laravel-storage:/var/www/html/storage
      - laravel-cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks: [default, vps-internal]

  scheduler:
    build: *app-build
    env_file:
      - path: ../.env
        required: true
    environment:
      RUN_MIGRATIONS: "0"
    command: ["php", "artisan", "schedule:work"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../.env:/var/www/html/.env:ro
      - laravel-storage:/var/www/html/storage
      - laravel-cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks: [default, vps-internal]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tiemnhaduy}
      MYSQL_USER: ${DB_USERNAME:-tiem}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [default]

volumes:
  mysql-data:
  laravel-storage:
  laravel-cache:

networks:
  vps-internal:
    name: vps-internal
    external: true
